# Part B of docs/BUNDLE-STORAGE-PLAN.md: capture an incident bundle in CI,
# store it as a GitHub Actions artifact (never in the repo), and record its
# whole-bundle SHA-256 fingerprint for the protected gate to pin.
#
# The capture runs with Checkly keys; it never prints a credential or a secret
# value. The bundle is written to $RUNNER_TEMP (outside any checkout) and the
# fingerprint is recomputed independently with the trusted helper before the
# artifact is uploaded, so the pin the gate consumes is proven, not just claimed.
name: verify-fix capture bundle

on:
  workflow_dispatch:
    inputs:
      check_id:
        description: Checkly check id to capture
        required: true
        type: string
      result_id:
        description: Failing result id to pin (optional)
        required: false
        type: string
      assets_dir:
        description: Directory of already-downloaded assets (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: capture a proof bundle outside the repo
    runs-on: ubuntu-latest
    environment: verify-fix-capture
    timeout-minutes: 45
    outputs:
      bundle_dir: ${{ steps.capture.outputs.bundle_dir }}
      digest: ${{ steps.capture.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Capture the incident bundle and record its fingerprint
        id: capture
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          CHECK_ID: ${{ inputs.check_id }}
          RESULT_ID: ${{ inputs.result_id }}
          ASSETS_DIR: ${{ inputs.assets_dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CHECKLY_API_KEY:-}" ]] || { echo '::error::CHECKLY_API_KEY is missing from verify-fix-capture'; exit 1; }
          [[ -n "${CHECKLY_ACCOUNT_ID:-}" ]] || { echo '::error::CHECKLY_ACCOUNT_ID is missing from verify-fix-capture'; exit 1; }
          [[ "$CHECK_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          # Store the bundle OUTSIDE the checkout, so proof never lands in the repo.
          bundle_dir="$RUNNER_TEMP/bundle"
          args=(bundle --check "$CHECK_ID" --out "$bundle_dir" --json)
          [[ -z "${RESULT_ID:-}" ]] || args+=(--result "$RESULT_ID")
          [[ -z "${ASSETS_DIR:-}" ]] || args+=(--assets "$ASSETS_DIR")
          node src/cli.ts "${args[@]}" > "$RUNNER_TEMP/capture.json"
          digest="$(jq -r .digest "$RUNNER_TEMP/capture.json")"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          # Recompute independently with the trusted gate helper: the pin the
          # gate will check must equal what the helper sees on disk.
          helper_digest="$(node .github/helpers/bundle-digest.mjs "$bundle_dir")"
          test "$helper_digest" = "$digest"
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### verify-fix bundle captured"
            echo ""
            echo "- bundle: \`$bundle_dir\` (outside any checkout)"
            echo "- sha256: \`$digest\`"
            echo "- artifact: \`verify-fix-bundle-$CHECK_ID\` from run \`$GITHUB_RUN_ID\`"
            echo ""
            echo "Set repository variables for the protected gate:"
            echo ""
            echo "- \`VERIFY_FIX_BUNDLE_ARTIFACT=verify-fix-bundle-$CHECK_ID\`"
            echo "- \`VERIFY_FIX_BUNDLE_ARTIFACT_RUN=$GITHUB_RUN_ID\`"
            echo "- \`VERIFY_FIX_BUNDLE_DIGEST=$digest\`"
            echo "- \`VERIFY_FIX_EXPECTED_CHECK_TYPE=<manifest.check.checkType>\`"
            echo "- \`VERIFY_FIX_EXPECTED_CHECK_FILE=<manifest.check.file>\`"
            echo "- \`VERIFY_FIX_EXPECTED_LOGICAL_ID=<manifest.check.logicalId>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-fix-bundle-${{ inputs.check_id }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14

      - name: Upload the capture record (fingerprint + metadata)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-fix-bundle-record-${{ inputs.check_id }}
          path: ${{ runner.temp }}/capture.json
          if-no-files-found: error
          retention-days: 14
