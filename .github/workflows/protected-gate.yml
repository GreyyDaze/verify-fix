# Reusable protected gate. The small deployment-status caller invokes this
# file at an immutable commit. Candidate source is always a separate checkout.
name: verify-fix protected gate

on:
  workflow_call:
    inputs:
      trusted_ref:
        description: >-
          Immutable commit that carries this protected workflow and its
          trusted helpers. Must equal the caller's `uses:` pin.
        required: true
        type: string
      deployment_id:
        required: true
        type: string
      deployment_sha:
        required: true
        type: string
      environment:
        required: true
        type: string
      environment_url:
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: verify-fix-${{ inputs.deployment_sha }}-${{ inputs.environment }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  CANDIDATE_PROJECT_PATH: examples/slots-booking/web
  VERIFY_FIX_BUNDLE: ${{ vars.VERIFY_FIX_BUNDLE || 'incidents/slots-availability-api' }}

jobs:
  candidate-preflight:
    name: secret-free candidate preflight
    if: >-
      inputs.environment_url != '' && inputs.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pull_url: ${{ steps.pull-request.outputs.url }}
      pull_number: ${{ steps.pull-request.outputs.number }}
      head_repository: ${{ steps.pull-request.outputs.head_repository }}
      fork: ${{ steps.pull-request.outputs.fork }}
    steps:
      - name: Validate deployment metadata and resolve its pull request
        id: pull-request
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_URL: ${{ inputs.environment_url }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID)
            if (!Number.isSafeInteger(deploymentId) || deploymentId <= 0 || !/^[0-9a-f]{40}$/.test(process.env.DEPLOYMENT_SHA ?? '')) {
              core.setFailed('Preview deployment identity is invalid.')
              return
            }
            let eventUrl
            try {
              eventUrl = new URL(process.env.DEPLOYMENT_URL)
            } catch {
              core.setFailed('Preview target is not a safe HTTPS origin.')
              return
            }
            if (eventUrl.protocol !== 'https:' || !eventUrl.hostname || eventUrl.username || eventUrl.password ||
                eventUrl.pathname !== '/' || eventUrl.search || eventUrl.hash || process.env.DEPLOYMENT_URL.length > 2048) {
              core.setFailed('Preview target is not a safe HTTPS origin.')
              return
            }
            const { data: deployment } = await github.rest.repos.getDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
            })
            if (deployment.sha !== process.env.DEPLOYMENT_SHA || deployment.environment !== process.env.DEPLOYMENT_ENVIRONMENT) {
              core.setFailed('Caller deployment metadata does not match GitHub.')
              return
            }
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              per_page: 100,
            })
            if (statuses.length === 100) {
              core.setFailed('Preview deployment status history may be incomplete.')
              return
            }
            const matches = statuses.filter((item) => item.environment_url === process.env.DEPLOYMENT_URL)
            const latest = matches.sort((a, b) => b.id - a.id)[0]
            if (!latest || latest.state !== 'success') {
              core.setFailed('GitHub has no current successful deployment status for this exact URL.')
              return
            }
            const sha = process.env.DEPLOYMENT_SHA
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            })
            const pull = pulls.find((item) => item.state === 'open' && item.head.sha === sha)
            if (!pull || !pull.head.repo?.full_name) {
              core.setFailed('No open pull request with a bound head repository owns this exact preview revision.')
              return
            }
            core.setOutput('url', pull.html_url)
            core.setOutput('number', String(pull.number))
            core.setOutput('head_repository', pull.head.repo.full_name)
            core.setOutput('fork', String(pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`))

      - name: Check out protected verifier and incident inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Require the protected verifier checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_REF"

      - name: Check out the exact candidate for dependency lookup
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pull-request.outputs.head_repository }}
          ref: ${{ inputs.deployment_sha }}
          path: candidate-runtime
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: trusted/package-lock.json

      - name: Install the protected verifier without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Require the runtime checkout to match the deployment
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        working-directory: candidate-runtime
        run: test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"

      - name: Inspect the immutable candidate without secrets
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_URL: ${{ steps.pull-request.outputs.url }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          node trusted/bin/verify-fix verify \
            --bundle "trusted/$VERIFY_FIX_BUNDLE" \
            --pr "$PULL_URL" \
            --project-path "$CANDIDATE_PROJECT_PATH" \
            --project "candidate-runtime/$CANDIDATE_PROJECT_PATH" \
            --executor scene \
            --report-json artifacts/verify-fix-preflight.json \
            --report-markdown artifacts/verify-fix-preflight.md
          code=$?
          set -e
          # No target was supplied, so a statically acceptable repair is
          # UNCERTAIN here. A definite static rejection is FAILED and blocks.
          test "$code" = 2
          test "$(jq -r .candidateRevision.headSha artifacts/verify-fix-preflight.json)" = "${{ inputs.deployment_sha }}"
          test "$(jq -r .candidateRevision.immutable artifacts/verify-fix-preflight.json)" = true

      - name: Upload secret-free preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-preflight-${{ inputs.deployment_sha }}
          path: artifacts/verify-fix-preflight.*
          if-no-files-found: warn

  preview-gate:
    name: protected preview gate
    needs: candidate-preflight
    runs-on: ubuntu-latest
    environment: verify-fix-preview
    timeout-minutes: 45
    steps:
      - name: Check out protected verifier and incident inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Require the protected verifier checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_REF"

      - name: Check out trusted workflow helpers at the immutable pin
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: workflow-trusted
          persist-credentials: false

      - name: Require the helper checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C workflow-trusted rev-parse HEAD)" = "$TRUSTED_REF"

      - name: Check out the exact candidate for runtime dependencies
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.candidate-preflight.outputs.head_repository }}
          ref: ${{ inputs.deployment_sha }}
          path: candidate-runtime
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            trusted/package-lock.json
            candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}/package-lock.json

      - name: Install the protected verifier without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Install candidate dependencies without lifecycle scripts
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npm ci --ignore-scripts

      - name: Install Chromium in a separate approved step
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Require the runtime checkout to match the deployment
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        working-directory: candidate-runtime
        run: test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"

      # Readiness: HTTP 200 + valid health JSON only, evaluated by trusted
      # helper code. A 302 is never readiness and redirects are never
      # followed. Public targets need no bypass header; protected targets
      # need the approved bypass value (named interface below), which is
      # configured only at a later explicit checkpoint — absent it, a
      # protected target fails closed.
      - name: Require the approved preview bypass to be configured
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: test -n "$BYPASS" || { echo '::error::preview bypass is not configured'; exit 1; }

      - name: Wait for the exact preview
        env:
          TARGET_URL: ${{ inputs.environment_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: node workflow-trusted/.github/helpers/probe-readiness.mjs "$TARGET_URL"

      - name: Require approved preview inputs
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TEST_USER: ${{ secrets.TEST_USER }}
        shell: bash
        run: |
          [[ -n "$CHECKLY_API_KEY" ]] || { echo '::error::CHECKLY_API_KEY is missing from verify-fix-preview'; exit 1; }
          [[ -n "$CHECKLY_ACCOUNT_ID" ]] || { echo '::error::CHECKLY_ACCOUNT_ID is missing from verify-fix-preview'; exit 1; }
          [[ -n "$TEST_USER" ]] || { echo '::error::TEST_USER is missing from verify-fix-preview'; exit 1; }

      - name: Build protected runtime and deployment metadata
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MULTISTEP_USER_US_EAST_1: ${{ secrets.MULTISTEP_USER_US_EAST_1 }}
          MULTISTEP_USER_EU_WEST_1: ${{ secrets.MULTISTEP_USER_EU_WEST_1 }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ inputs.environment_url }}
          TARGET_REVISION: ${{ inputs.deployment_sha }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file=""
          metadata_file=""
          trap 'rm -f -- "$env_file" "$metadata_file"' ERR
          env_file="$(mktemp "$RUNNER_TEMP/verify-fix-preview.XXXXXXXX")"
          metadata_file="$(mktemp "$RUNNER_TEMP/verify-fix-preview-target.XXXXXXXX")"
          chmod 0600 "$env_file" "$metadata_file"
          # Legacy API/Playwright preview jobs never expose Multistep account
          # values to their candidate checks. Only a reviewed Multistep bundle
          # receives these extra secret names inside its approved job.
          [[ "$VERIFY_FIX_BUNDLE" =~ ^incidents/[A-Za-z0-9_-]+$ ]]
          bundle_type="$(jq -r '.check.checkType // empty' "trusted/$VERIFY_FIX_BUNDLE/manifest.json")"
          [[ "$bundle_type" == "API" || "$bundle_type" == "PLAYWRIGHT" || "$bundle_type" == "MULTI_STEP" ]]
          input_names=(TEST_USER TEST_USER_US_EAST_1 TEST_USER_EU_WEST_1 API_TOKEN BYPASS)
          if [[ "$bundle_type" == MULTI_STEP ]]; then
            input_names+=(MULTISTEP_USER_US_EAST_1 MULTISTEP_USER_EU_WEST_1)
          fi
          # Neither region may share a browser account or the other region's
          # account. Do not print any value. The verifier also checks trimming,
          # control bytes, and both-region selection before launching a child.
          if [[ "$bundle_type" == MULTI_STEP ]]; then
            [[ -n "${MULTISTEP_USER_US_EAST_1:-}" && -n "${MULTISTEP_USER_EU_WEST_1:-}" && "$MULTISTEP_USER_US_EAST_1" != "$MULTISTEP_USER_EU_WEST_1" ]] || { echo '::error::Multistep regional inputs are missing or overlap'; false; }
            for browser_key in TEST_USER TEST_USER_US_EAST_1 TEST_USER_EU_WEST_1; do
              [[ -z "${!browser_key-}" || ( "${!browser_key}" != "$MULTISTEP_USER_US_EAST_1" && "${!browser_key}" != "$MULTISTEP_USER_EU_WEST_1" ) ]] || { echo '::error::Multistep and browser identities overlap'; false; }
            done
          fi
          for name in "${input_names[@]}"; do
            value="${!name-}"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo '::error::invalid protected input'; false; }
            if [[ -n "$value" ]]; then
              if [[ "$name" == BYPASS ]]; then
                printf 'CHECKLY_SECRET_VERCEL_AUTOMATION_BYPASS_SECRET=%s\n' "$value" >> "$env_file"
              else
                printf '%s=%s\n' "$name" "$value" >> "$env_file"
              fi
            fi
          done
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({provider:"github-deployment",deploymentId:process.env.DEPLOYMENT_ID,revision:process.env.TARGET_REVISION,url:process.env.TARGET_URL,environment:process.env.DEPLOYMENT_ENVIRONMENT}))' "$metadata_file"
          echo "VERIFY_FIX_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "VERIFY_FIX_TARGET_METADATA=$metadata_file" >> "$GITHUB_ENV"

      - name: Verify the candidate through the protected gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TARGET_URL: ${{ inputs.environment_url }}
          TARGET_REVISION: ${{ inputs.deployment_sha }}
          PULL_URL: ${{ needs.candidate-preflight.outputs.pull_url }}
          FORK: ${{ needs.candidate-preflight.outputs.fork }}
        shell: bash
        run: |
          mkdir -p artifacts
          fork_args=()
          if [[ "$FORK" == "true" ]]; then fork_args=(--allow-fork-cloud); fi
          node trusted/bin/verify-fix verify \
            --bundle "trusted/$VERIFY_FIX_BUNDLE" \
            --pr "$PULL_URL" \
            --project-path "$CANDIDATE_PROJECT_PATH" \
            --project "candidate-runtime/$CANDIDATE_PROJECT_PATH" \
            --target "$TARGET_URL" \
            --target-revision "$TARGET_REVISION" \
            --target-metadata "$VERIFY_FIX_TARGET_METADATA" \
            --cloud-approved \
            "${fork_args[@]}" \
            --env-name preview \
            --env-file "$VERIFY_FIX_ENV_FILE" \
            --executor hybrid \
            --report-json artifacts/verify-fix.json \
            --report-markdown artifacts/verify-fix.md \
            --verbose
          test "$(jq -r .targetBinding.gateEligible artifacts/verify-fix.json)" = true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-${{ inputs.deployment_sha }}
          path: artifacts/verify-fix.*
          if-no-files-found: warn

      - name: Remove preview runtime inputs
        if: always()
        shell: bash
        run: |
          for file in "${VERIFY_FIX_ENV_FILE:-}" "${VERIFY_FIX_TARGET_METADATA:-}"; do
            [[ -z "$file" ]] || { [[ "$file" == "$RUNNER_TEMP/"* ]] && rm -f -- "$file"; }
          done

  # Secret-free preflight that must complete before any job with the
  # protected production environment can request approval.
  #   - no GitHub environment, no repository or environment secret;
  #   - makes no Vercel API call and requires no VERCEL_TOKEN;
  #   - requires the deployment SHA to equal BOTH the caller SHA and the
  #     current main SHA before approval, then inspects the full bounded
  #     status history of that exact deployment:
  #     the automatic generated-URL status is the verification target and the
  #     manually verified stable status (identified only by the exact marker
  #     in .github/helpers/deployment-url-roles.mjs) is the monitoring target;
  #   - requires successful states, bare HTTPS origins (no path, query, or
  #     fragment; no embedded credentials), two distinct roles, and rejects
  #     ambiguous or conflicting matches;
  #   - exposes verification_url and monitoring_url only for a complete
  #     valid pair (ready=true).
  # Status ordering: generated-only → waiting (ready=false, no approval);
  # manual-only → waiting; a later event with both valid statuses may become
  # ready. Malformed, conflicting, ambiguous, wrong-deployment, or wrong-SHA
  # evidence fails closed. Helper code is the trusted checkout at
  # inputs.trusted_ref (the caller's immutable pin), never candidate code.
  production-preflight:
    name: secret-free production URL preflight
    if: >-
      inputs.environment_url != '' && inputs.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      reason: ${{ steps.resolve.outputs.reason }}
      verification_url: ${{ steps.resolve.outputs.verification_url }}
      monitoring_url: ${{ steps.resolve.outputs.monitoring_url }}
      deployment_id: ${{ steps.resolve.outputs.deployment_id }}
      deployment_sha: ${{ steps.resolve.outputs.deployment_sha }}
      generated_status_id: ${{ steps.resolve.outputs.generated_status_id }}
      stable_status_id: ${{ steps.resolve.outputs.stable_status_id }}
    steps:
      - name: Check out trusted workflow helpers at the immutable pin
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: workflow-trusted
          persist-credentials: false

      - name: Require the helper checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C workflow-trusted rev-parse HEAD)" = "$TRUSTED_REF"

      # Every helper-executing job installs the pinned runtime first — never
      # the runner's system Node.
      - name: Set up Node.js to run trusted helper code
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve URL roles from GitHub deployment metadata and statuses
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          EVENT_URL: ${{ inputs.environment_url }}
        shell: bash
        run: node workflow-trusted/.github/helpers/run-production-url-preflight.mjs

  production-verify-and-deploy:
    name: verify production then deploy checks
    needs: production-preflight
    if: >-
      inputs.environment_url != '' && inputs.environment == 'Production' &&
      needs.production-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: verify-fix-production
    timeout-minutes: 45
    steps:
      - name: Check out exact production source (not the verifier)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_sha }}
          path: candidate-runtime
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted workflow helpers at the immutable pin
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: workflow-trusted
          persist-credentials: false

      - name: Require the helper checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C workflow-trusted rev-parse HEAD)" = "$TRUSTED_REF"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Recheck after approval: a deployment/status pair or main HEAD could
      # have changed while the reviewer was deciding. No protected credential
      # is given to these steps, and neither executes the candidate project.
      - name: Revalidate production identity and both URL roles after approval
        id: revalidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          EVENT_URL: ${{ inputs.environment_url }}
        shell: bash
        run: node workflow-trusted/.github/helpers/run-production-url-preflight.mjs

      - name: Require the approved pair to be unchanged
        env:
          ORIGINAL_READY: ${{ needs.production-preflight.outputs.ready }}
          ORIGINAL_ID: ${{ needs.production-preflight.outputs.deployment_id }}
          ORIGINAL_SHA: ${{ needs.production-preflight.outputs.deployment_sha }}
          ORIGINAL_GENERATED_ID: ${{ needs.production-preflight.outputs.generated_status_id }}
          ORIGINAL_STABLE_ID: ${{ needs.production-preflight.outputs.stable_status_id }}
          ORIGINAL_VERIFICATION: ${{ needs.production-preflight.outputs.verification_url }}
          ORIGINAL_MONITORING: ${{ needs.production-preflight.outputs.monitoring_url }}
          CURRENT_READY: ${{ steps.revalidate.outputs.ready }}
          CURRENT_ID: ${{ steps.revalidate.outputs.deployment_id }}
          CURRENT_SHA: ${{ steps.revalidate.outputs.deployment_sha }}
          CURRENT_GENERATED_ID: ${{ steps.revalidate.outputs.generated_status_id }}
          CURRENT_STABLE_ID: ${{ steps.revalidate.outputs.stable_status_id }}
          CURRENT_VERIFICATION: ${{ steps.revalidate.outputs.verification_url }}
          CURRENT_MONITORING: ${{ steps.revalidate.outputs.monitoring_url }}
        shell: bash
        run: |
          test "$ORIGINAL_READY" = true && test "$CURRENT_READY" = true
          test "$ORIGINAL_ID" = "$CURRENT_ID" && test "$ORIGINAL_SHA" = "$CURRENT_SHA"
          test "$ORIGINAL_GENERATED_ID" = "$CURRENT_GENERATED_ID"
          test "$ORIGINAL_STABLE_ID" = "$CURRENT_STABLE_ID"
          test "$ORIGINAL_VERIFICATION" = "$CURRENT_VERIFICATION"
          test "$ORIGINAL_MONITORING" = "$CURRENT_MONITORING"

      # The candidate checkout above supplies only runtime dependencies and
      # the main revision under test. The verifier and incident are an
      # immutable protected snapshot; neither comes from candidate code.
      - name: Check out protected verifier and incident inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Require the protected verifier checkout to equal the trusted pin
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        shell: bash
        run: |
          [[ "$TRUSTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_REF"

      - name: Require checkout to equal the deployed revision
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        working-directory: candidate-runtime
        run: test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"

      # Phase 7 has no reviewed real Multistep incident bundle yet. The
      # legacy API example is never an eligible production fallback. This
      # guard fails closed until a reviewed bundle is pinned with the trusted
      # verifier and its explicit path is configured in VERIFY_FIX_BUNDLE.
      - name: Require a reviewed Phase 7 Multistep incident bundle
        env:
          APPROVED_BUNDLE: ${{ vars.VERIFY_FIX_BUNDLE }}
        shell: bash
        run: |
          [[ "$APPROVED_BUNDLE" =~ ^incidents/[A-Za-z0-9_-]+$ ]] || { echo '::error::reviewed Phase 7 bundle is not configured'; exit 1; }
          test "$APPROVED_BUNDLE" = "$VERIFY_FIX_BUNDLE"
          test -f "trusted/$APPROVED_BUNDLE/manifest.json"
          jq -e '.schemaVersion == "v3" and .check.checkType == "MULTI_STEP" and .check.file == "checks/multistep-booking.spec.ts" and .check.logicalId == "slots-booking-multistep" and .recordings.multistepFailing == "recordings/failing.multistep.json"' "trusted/$APPROVED_BUNDLE/manifest.json" > /dev/null

      # Verification target = the generated deployment URL resolved by the
      # secret-free preflight (never a guessed host). Readiness is HTTP 200 +
      # valid health JSON evaluated by trusted helper code; a 302 is never
      # readiness and redirects are never followed. Public targets need no
      # bypass; protected targets need the approved bypass value from the
      # named interface below, configured only at a later explicit
      # checkpoint — absent it, a protected target fails closed.
      - name: Require the protected production bypass to be configured
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: test -n "$BYPASS" || { echo '::error::production bypass is not configured'; exit 1; }

      - name: Require the verification target to be ready
        env:
          TARGET_URL: ${{ needs.production-preflight.outputs.verification_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: node workflow-trusted/.github/helpers/probe-readiness.mjs "$TARGET_URL"

      - name: Install the protected verifier without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Install project dependencies without lifecycle scripts
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npm ci --ignore-scripts

      - name: Install Chromium separately
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Build private runtime inputs and exact target metadata
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MULTISTEP_USER_US_EAST_1: ${{ secrets.MULTISTEP_USER_US_EAST_1 }}
          MULTISTEP_USER_EU_WEST_1: ${{ secrets.MULTISTEP_USER_EU_WEST_1 }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERIFIED_ID: ${{ needs.production-preflight.outputs.deployment_id }}
          VERIFIED_SHA: ${{ needs.production-preflight.outputs.deployment_sha }}
          VERIFIED_URL: ${{ needs.production-preflight.outputs.verification_url }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file=""
          metadata_file=""
          trap 'rm -f -- "$env_file" "$metadata_file"' ERR
          env_file="$(mktemp "$RUNNER_TEMP/verify-fix-production.XXXXXXXX")"
          metadata_file="$(mktemp "$RUNNER_TEMP/verify-fix-production-target.XXXXXXXX")"
          chmod 0600 "$env_file" "$metadata_file"
          # The earlier Phase 7 bundle guard already required MULTI_STEP.
          input_names=(TEST_USER TEST_USER_US_EAST_1 TEST_USER_EU_WEST_1 API_TOKEN BYPASS MULTISTEP_USER_US_EAST_1 MULTISTEP_USER_EU_WEST_1)
          # Neither region may share a browser account or the other region's
          # account. Do not print any value. The verifier also checks trimming,
          # control bytes, and both-region selection before launching a child.
          [[ -n "${MULTISTEP_USER_US_EAST_1:-}" && -n "${MULTISTEP_USER_EU_WEST_1:-}" && "$MULTISTEP_USER_US_EAST_1" != "$MULTISTEP_USER_EU_WEST_1" ]] || { echo '::error::Multistep regional inputs are missing or overlap'; false; }
          for browser_key in TEST_USER TEST_USER_US_EAST_1 TEST_USER_EU_WEST_1; do
            [[ -z "${!browser_key-}" || ( "${!browser_key}" != "$MULTISTEP_USER_US_EAST_1" && "${!browser_key}" != "$MULTISTEP_USER_EU_WEST_1" ) ]] || { echo '::error::Multistep and browser identities overlap'; false; }
          done
          for name in "${input_names[@]}"; do
            value="${!name-}"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo '::error::invalid protected input'; false; }
            if [[ -n "$value" ]]; then
              if [[ "$name" == BYPASS ]]; then
                printf 'CHECKLY_SECRET_VERCEL_AUTOMATION_BYPASS_SECRET=%s\n' "$value" >> "$env_file"
              else
                printf '%s=%s\n' "$name" "$value" >> "$env_file"
              fi
            fi
          done
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({provider:"github-deployment",deploymentId:process.env.VERIFIED_ID,revision:process.env.VERIFIED_SHA,url:process.env.VERIFIED_URL,environment:"Production"}))' "$metadata_file"
          echo "VERIFY_FIX_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "VERIFY_FIX_TARGET_METADATA=$metadata_file" >> "$GITHUB_ENV"

      - name: Verify production with the pinned verifier before any Checkly deploy
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TARGET_URL: ${{ needs.production-preflight.outputs.verification_url }}
          TARGET_REVISION: ${{ needs.production-preflight.outputs.deployment_sha }}
          APPROVED_DEPLOYMENT_ID: ${{ needs.production-preflight.outputs.deployment_id }}
        shell: bash
        run: |
          mkdir -p artifacts
          node trusted/bin/verify-fix verify \
            --bundle "trusted/$VERIFY_FIX_BUNDLE" \
            --candidate-project candidate-runtime \
            --base "$TARGET_REVISION" \
            --project "candidate-runtime/$CANDIDATE_PROJECT_PATH" \
            --target "$TARGET_URL" \
            --target-revision "$TARGET_REVISION" \
            --target-metadata "$VERIFY_FIX_TARGET_METADATA" \
            --env-name production \
            --env-file "$VERIFY_FIX_ENV_FILE" \
            --executor hybrid \
            --report-json artifacts/verify-fix-production.json \
            --report-markdown artifacts/verify-fix-production.md
          test "$(jq -r .verdict artifacts/verify-fix-production.json)" = PASS
          test "$(jq -r .target artifacts/verify-fix-production.json)" = "$TARGET_URL"
          test "$(jq -r .targetRevision artifacts/verify-fix-production.json)" = "$TARGET_REVISION"
          test "$(jq -r .candidateRevision.source artifacts/verify-fix-production.json)" = local
          test "$(jq -r .candidateRevision.headSha artifacts/verify-fix-production.json)" = "$TARGET_REVISION"
          test "$(jq -r .candidateRevision.dirty artifacts/verify-fix-production.json)" = false
          test "$(jq -r .targetBinding.scope artifacts/verify-fix-production.json)" = local
          test "$(jq -r .targetBinding.sourceRevision artifacts/verify-fix-production.json)" = "$TARGET_REVISION"
          test "$(jq -r .targetBinding.targetRevision artifacts/verify-fix-production.json)" = "$TARGET_REVISION"
          test "$(jq -r .targetBinding.deployment.deploymentId artifacts/verify-fix-production.json)" = "$APPROVED_DEPLOYMENT_ID"
          test "$(jq -r .targetBinding.deployment.url artifacts/verify-fix-production.json)" = "$TARGET_URL"

      # Deployment preview runs first and must PASS before the force step can
      # start (a failed step halts this job). Identical environment names and
      # values as the force step, same stable monitoring URL — never the
      # generated verification URL.
      - name: Preview monitoring source before force
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          # Environment-provided Multistep monitoring identities — names and
          # secret references only. Values are never committed, never printed,
          # never passed as arguments, and never exposed as outputs. Kept
          # separate from the browser TEST_USER identities above.
          MULTISTEP_USER_US_EAST_1: ${{ secrets.MULTISTEP_USER_US_EAST_1 }}
          MULTISTEP_USER_EU_WEST_1: ${{ secrets.MULTISTEP_USER_EU_WEST_1 }}
          # Monitoring target = the manually verified stable alias only —
          # never the generated verification URL, never a guessed host.
          ENVIRONMENT_URL: ${{ needs.production-preflight.outputs.monitoring_url }}
        run: npx checkly deploy --preview

      - name: Recheck current main and both status IDs immediately before deploy
        id: final-roles
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          EVENT_URL: ${{ inputs.environment_url }}
        shell: bash
        run: node workflow-trusted/.github/helpers/run-production-url-preflight.mjs

      - name: Preserve the approved role identities and PASS as bounded evidence
        env:
          APPROVED_ID: ${{ needs.production-preflight.outputs.deployment_id }}
          APPROVED_SHA: ${{ needs.production-preflight.outputs.deployment_sha }}
          APPROVED_GENERATED_ID: ${{ needs.production-preflight.outputs.generated_status_id }}
          APPROVED_STABLE_ID: ${{ needs.production-preflight.outputs.stable_status_id }}
          APPROVED_VERIFICATION: ${{ needs.production-preflight.outputs.verification_url }}
          APPROVED_MONITORING: ${{ needs.production-preflight.outputs.monitoring_url }}
          FINAL_READY: ${{ steps.final-roles.outputs.ready }}
          FINAL_ID: ${{ steps.final-roles.outputs.deployment_id }}
          FINAL_SHA: ${{ steps.final-roles.outputs.deployment_sha }}
          FINAL_GENERATED_ID: ${{ steps.final-roles.outputs.generated_status_id }}
          FINAL_STABLE_ID: ${{ steps.final-roles.outputs.stable_status_id }}
          FINAL_VERIFICATION: ${{ steps.final-roles.outputs.verification_url }}
          FINAL_MONITORING: ${{ steps.final-roles.outputs.monitoring_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_READY" = true && test "$FINAL_ID" = "$APPROVED_ID"
          test "$FINAL_SHA" = "$APPROVED_SHA"
          test "$FINAL_GENERATED_ID" = "$APPROVED_GENERATED_ID"
          test "$FINAL_STABLE_ID" = "$APPROVED_STABLE_ID"
          test "$FINAL_VERIFICATION" = "$APPROVED_VERIFICATION"
          test "$FINAL_MONITORING" = "$APPROVED_MONITORING"
          test "$(jq -r .verdict artifacts/verify-fix-production.json)" = PASS
          node -e 'const fs=require("node:fs"); fs.writeFileSync("artifacts/verify-fix-production-roles.json", JSON.stringify({deploymentId:process.env.APPROVED_ID,sha:process.env.APPROVED_SHA,generatedStatusId:process.env.APPROVED_GENERATED_ID,stableStatusId:process.env.APPROVED_STABLE_ID,verificationUrl:process.env.APPROVED_VERIFICATION,monitoringUrl:process.env.APPROVED_MONITORING,verdict:"PASS"})+"\n", {mode:0o600})'

      - name: Deploy monitoring source after PASS
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          # Environment-provided Multistep monitoring identities — names and
          # secret references only. Values are never committed, never printed,
          # never passed as arguments, and never exposed as outputs. Kept
          # separate from the browser TEST_USER identities above.
          MULTISTEP_USER_US_EAST_1: ${{ secrets.MULTISTEP_USER_US_EAST_1 }}
          MULTISTEP_USER_EU_WEST_1: ${{ secrets.MULTISTEP_USER_EU_WEST_1 }}
          # Monitoring target = the manually verified stable alias only —
          # never the generated verification URL, never a guessed host.
          ENVIRONMENT_URL: ${{ needs.production-preflight.outputs.monitoring_url }}
        run: npx checkly deploy --force

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-production-${{ inputs.deployment_sha }}
          path: artifacts/verify-fix-production.*
          if-no-files-found: warn

      - name: Remove production runtime inputs
        if: always()
        shell: bash
        run: |
          for file in "${VERIFY_FIX_ENV_FILE:-}" "${VERIFY_FIX_TARGET_METADATA:-}"; do
            [[ -z "$file" ]] || { [[ "$file" == "$RUNNER_TEMP/"* ]] && rm -f -- "$file"; }
          done
