name: Checkly checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkly:
    name: build and run the check suite locally
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: web

      - name: Build the app
        run: npm run build
        working-directory: web

      - name: Start the app
        run: npm run start -- -p 3000 &
        working-directory: web

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo '::error::app did not become ready'; exit 1

      - name: Run the Playwright check suite locally
        run: npx playwright test
        working-directory: web
        env:
          ENVIRONMENT_URL: http://localhost:3000
          TEST_USER: demo