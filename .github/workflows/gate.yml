# This workflow is a protected input.
# GitHub loads deployment_status workflows from the default branch. The job
# also checks out the default branch as `trusted` and executes verify-fix from
# there. A pull request is checked out separately and cannot replace the
# verifier, incident bundle, policy code, or this gate definition.
name: verify-fix gate

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: verify-fix-${{ github.event.deployment.sha }}-${{ github.event.deployment.environment }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CANDIDATE_PROJECT_PATH: examples/slots-booking/web
  VERIFY_FIX_BUNDLE: ${{ vars.VERIFY_FIX_BUNDLE || 'fixtures/bundles/slots-booking-drift' }}

jobs:
  candidate-preflight:
    name: secret-free candidate preflight
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pull_url: ${{ steps.pull-request.outputs.url }}
      pull_number: ${{ steps.pull-request.outputs.number }}
      head_repository: ${{ steps.pull-request.outputs.head_repository }}
      fork: ${{ steps.pull-request.outputs.fork }}
    steps:
      - name: Resolve the pull request that owns this deployment
        id: pull-request
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            })
            const pull = pulls.find((item) => item.state === 'open' && item.head.sha === sha)
            if (!pull) {
              core.setFailed('No open pull request owns this exact preview revision.')
              return
            }
            core.setOutput('url', pull.html_url)
            core.setOutput('number', String(pull.number))
            core.setOutput('head_repository', pull.head.repo?.full_name ?? `${context.repo.owner}/${context.repo.repo}`)
            core.setOutput('fork', String(pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`))

      - name: Check out protected verifier and incident inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out the exact candidate for dependency lookup
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pull-request.outputs.head_repository }}
          ref: ${{ github.event.deployment.sha }}
          path: candidate-runtime
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: trusted/package-lock.json

      - name: Install the protected verifier without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Require the runtime checkout to match the deployment
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        working-directory: candidate-runtime
        run: test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"

      - name: Inspect the immutable candidate without secrets
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_URL: ${{ steps.pull-request.outputs.url }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          node trusted/bin/verify-fix verify \
            --bundle "trusted/$VERIFY_FIX_BUNDLE" \
            --pr "$PULL_URL" \
            --project-path "$CANDIDATE_PROJECT_PATH" \
            --project "candidate-runtime/$CANDIDATE_PROJECT_PATH" \
            --executor scene \
            --report-json artifacts/verify-fix-preflight.json \
            --report-markdown artifacts/verify-fix-preflight.md
          code=$?
          set -e
          # No target was supplied, so a statically acceptable repair is
          # UNCERTAIN here. A definite static rejection is FAILED and blocks.
          test "$code" = 2
          test "$(jq -r .candidateRevision.headSha artifacts/verify-fix-preflight.json)" = "${{ github.event.deployment.sha }}"
          test "$(jq -r .candidateRevision.immutable artifacts/verify-fix-preflight.json)" = true

      - name: Upload secret-free preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-preflight-${{ github.event.deployment.sha }}
          path: artifacts/verify-fix-preflight.*
          if-no-files-found: warn

  preview-gate:
    name: protected preview gate
    needs: candidate-preflight
    runs-on: ubuntu-latest
    environment: verify-fix-preview
    timeout-minutes: 45
    steps:
      - name: Check out protected verifier and incident inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out the exact candidate for runtime dependencies
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.candidate-preflight.outputs.head_repository }}
          ref: ${{ github.event.deployment.sha }}
          path: candidate-runtime
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            trusted/package-lock.json
            candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}/package-lock.json

      - name: Install the protected verifier without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Install candidate dependencies without lifecycle scripts
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npm ci --ignore-scripts

      - name: Install Chromium in a separate approved step
        working-directory: candidate-runtime/${{ env.CANDIDATE_PROJECT_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Require the runtime checkout to match the deployment
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        working-directory: candidate-runtime
        run: test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"

      - name: Wait for the exact preview
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          node -e "const u=new URL(process.env.TARGET_URL); if(u.protocol!=='https:') throw new Error('preview URL must use HTTPS')"
          header=()
          if [[ -n "$BYPASS" ]]; then header=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "${header[@]}" "$TARGET_URL/api/health" >/dev/null

      - name: Build protected runtime and deployment metadata
        env:
          TEST_USER: ${{ secrets.VERIFY_FIX_PREVIEW_TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.VERIFY_FIX_PREVIEW_TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.VERIFY_FIX_PREVIEW_TEST_USER_EU_WEST_1 }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_REVISION: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/verify-fix.env"
          metadata_file="$RUNNER_TEMP/verify-fix-target.json"
          umask 077
          : > "$env_file"
          [[ -n "$TEST_USER" ]] && printf 'TEST_USER=%s\n' "$TEST_USER" >> "$env_file"
          [[ -n "$TEST_USER_US_EAST_1" ]] && printf 'TEST_USER_US_EAST_1=%s\n' "$TEST_USER_US_EAST_1" >> "$env_file"
          [[ -n "$TEST_USER_EU_WEST_1" ]] && printf 'TEST_USER_EU_WEST_1=%s\n' "$TEST_USER_EU_WEST_1" >> "$env_file"
          [[ -n "$BYPASS" ]] && printf 'CHECKLY_SECRET_VERCEL_AUTOMATION_BYPASS_SECRET=%s\n' "$BYPASS" >> "$env_file"
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({provider:"github-deployment",deploymentId:process.env.DEPLOYMENT_ID,revision:process.env.TARGET_REVISION,url:process.env.TARGET_URL,environment:process.env.DEPLOYMENT_ENVIRONMENT}))' "$metadata_file"
          echo "VERIFY_FIX_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "VERIFY_FIX_TARGET_METADATA=$metadata_file" >> "$GITHUB_ENV"

      - name: Verify the candidate through the protected gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_PREVIEW_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_PREVIEW_ACCOUNT_ID }}
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_REVISION: ${{ github.event.deployment.sha }}
          PULL_URL: ${{ needs.candidate-preflight.outputs.pull_url }}
          FORK: ${{ needs.candidate-preflight.outputs.fork }}
        shell: bash
        run: |
          mkdir -p artifacts
          fork_args=()
          if [[ "$FORK" == "true" ]]; then fork_args=(--allow-fork-cloud); fi
          node trusted/bin/verify-fix verify \
            --bundle "trusted/$VERIFY_FIX_BUNDLE" \
            --pr "$PULL_URL" \
            --project-path "$CANDIDATE_PROJECT_PATH" \
            --project "candidate-runtime/$CANDIDATE_PROJECT_PATH" \
            --target "$TARGET_URL" \
            --target-revision "$TARGET_REVISION" \
            --target-metadata "$VERIFY_FIX_TARGET_METADATA" \
            --cloud-approved \
            "${fork_args[@]}" \
            --env-name preview \
            --env-file "$VERIFY_FIX_ENV_FILE" \
            --executor hybrid \
            --report-json artifacts/verify-fix.json \
            --report-markdown artifacts/verify-fix.md \
            --verbose
          test "$(jq -r .targetBinding.gateEligible artifacts/verify-fix.json)" = true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-${{ github.event.deployment.sha }}
          path: artifacts/verify-fix.*
          if-no-files-found: warn

  production-verify-and-deploy:
    name: verify production then deploy checks
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    environment: verify-fix-production
    timeout-minutes: 45
    steps:
      - name: Check out protected verifier and production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the deployed commit to be current main
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install project dependencies without lifecycle scripts
        working-directory: ${{ env.CANDIDATE_PROJECT_PATH }}
        run: npm ci --ignore-scripts

      - name: Install Chromium separately
        working-directory: ${{ env.CANDIDATE_PROJECT_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Build temporary runtime environment
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
        shell: bash
        run: |
          file="$RUNNER_TEMP/verify-fix.env"
          umask 077
          : > "$file"
          [[ -n "$TEST_USER" ]] && printf 'TEST_USER=%s\n' "$TEST_USER" >> "$file"
          [[ -n "$TEST_USER_US_EAST_1" ]] && printf 'TEST_USER_US_EAST_1=%s\n' "$TEST_USER_US_EAST_1" >> "$file"
          [[ -n "$TEST_USER_EU_WEST_1" ]] && printf 'TEST_USER_EU_WEST_1=%s\n' "$TEST_USER_EU_WEST_1" >> "$file"
          echo "VERIFY_FIX_ENV_FILE=$file" >> "$GITHUB_ENV"

      - name: Verify production source
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_REVISION: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          mkdir -p artifacts
          node bin/verify-fix verify \
            --bundle "$VERIFY_FIX_BUNDLE" \
            --candidate-project "$CANDIDATE_PROJECT_PATH" \
            --base "$TARGET_REVISION" \
            --project "$CANDIDATE_PROJECT_PATH" \
            --target "$TARGET_URL" \
            --target-revision "$TARGET_REVISION" \
            --env-name production \
            --env-file "$VERIFY_FIX_ENV_FILE" \
            --executor hybrid \
            --report-json artifacts/verify-fix-production.json \
            --report-markdown artifacts/verify-fix-production.md \
            --verbose

      - name: Deploy monitoring source after PASS
        working-directory: ${{ env.CANDIDATE_PROJECT_PATH }}
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_US_EAST_1: ${{ secrets.TEST_USER_US_EAST_1 }}
          TEST_USER_EU_WEST_1: ${{ secrets.TEST_USER_EU_WEST_1 }}
        run: npx checkly deploy --force

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fix-production-${{ github.event.deployment.sha }}
          path: artifacts/verify-fix-production.*
          if-no-files-found: warn
