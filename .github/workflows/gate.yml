# This event adapter never checks out or executes candidate code directly.
# The reusable gate is pinned to an immutable reviewed commit. Keep its check
# names required in the repository ruleset so a candidate cannot bypass it.
name: verify-fix gate

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  protected-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    uses: GreyyDaze/verify-fix/.github/workflows/protected-gate.yml@9b4322c6e4f14d71ce89274a28c7a18444b00a61
    with:
      # Keep this pin byte-identical to the `uses:` ref above; both lines
      # always move together. The protected workflow checks out its trusted
      # helpers at exactly this ref — never a candidate ref. This ref is the
      # trusted Stage 2 snapshot carrying the protected workflow and its
      # helpers.
      trusted_ref: 9b4322c6e4f14d71ce89274a28c7a18444b00a61
      deployment_id: ${{ format('{0}', github.event.deployment.id) }}
      deployment_sha: ${{ github.event.deployment.sha }}
      environment: ${{ github.event.deployment.environment }}
      environment_url: ${{ github.event.deployment_status.environment_url }}
    secrets: inherit
